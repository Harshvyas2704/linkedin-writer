<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinkedIn Message Writer</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-view="write">Write</button>
    <button class="tab" data-view="me">My profile</button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>

  <div id="status" class="status" hidden></div>

  <!-- WRITE -->
  <section id="write" class="view">
    <button id="scanBtn" class="primary">Scan this profile</button>

    <div id="targetBox" class="card" hidden>
      <div class="target-name" id="targetName"></div>
      <div class="muted" id="targetFound"></div>
      <details>
        <summary>View / edit scanned text</summary>
        <textarea id="targetText" rows="10"></textarea>
      </details>
    </div>

    <label>Message type
      <div class="seg" id="type">
        <button data-val="note" class="on">Connection note</button>
        <button data-val="dm">DM / InMail</button>
      </div>
    </label>

    <label>Goal
      <select id="goal">
        <option value="referral">Ask for a referral</option>
        <option value="roles">Ask about open roles</option>
        <option value="network">Just connect / introduce</option>
        <option value="followup">Follow up on my application</option>
        <option value="custom">Custom…</option>
      </select>
    </label>
    <input id="customGoal" placeholder="Describe your goal" hidden />

    <label>Tone
      <select id="tone">
        <option value="friendly">Friendly</option>
        <option value="professional">Professional</option>
        <option value="direct">Direct</option>
      </select>
    </label>

    <label>Role or job link (optional)
      <input id="role" placeholder="e.g. Backend Engineer (Node.js), job ID 12345" />
    </label>

    <label>Anything else to mention (optional)
      <input id="extra" placeholder="e.g. we both spoke at JSConf, I applied last week" />
    </label>

    <button id="genBtn" class="primary" disabled>Generate 3 drafts</button>

    <div id="hooks" class="muted small" hidden></div>
    <div id="results"></div>
  </section>

  <!-- MY PROFILE -->
  <section id="me" class="view" hidden>
    <p class="muted small">This is what makes the messages about you. Fill it once. Saved only in this browser.</p>
    <button id="importBtn">Fill background from my LinkedIn</button>
    <p class="muted small">Open your own LinkedIn profile first, then click above.</p>

    <label>Your name <input id="myName" /></label>
    <label>Current role <input id="myRole" placeholder="React Native Developer at Acme, 3 yrs" /></label>
    <label>Background (skills, projects, results)
      <textarea id="myBio" rows="6" placeholder="Shipped 4 production React Native apps... Built a Node.js + Gemini backend..."></textarea>
    </label>
    <label>What you're looking for
      <textarea id="myGoal" rows="3" placeholder="Backend / full-stack roles, Bangalore or remote, 30 day notice"></textarea>
    </label>
    <label>Links (portfolio, GitHub)
      <input id="myLinks" placeholder="yoursite.dev, github.com/you" />
    </label>
    <label>A past message you liked (optional, for voice)
      <textarea id="mySample" rows="4"></textarea>
    </label>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="view" hidden>
    <label>Gemini API key
      <input id="apiKey" type="password" placeholder="Paste key from aistudio.google.com" />
    </label>
    <label>Model
      <input id="model" list="models" />
      <datalist id="models">
        <option value="gemini-3.8-flash"></option>
        <option value="gemini-3.5-flash-lite"></option>
      </datalist>
    </label>
    <p class="muted small">Your key stays in this browser's extension storage and is only sent to Google.</p>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
